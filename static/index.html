<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Codex Share</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0d;
      --surface-1: #101012;
      --surface-2: #151518;
      --surface-3: #1a1a1e;
      --border: #27272c;
      --border-strong: #35353c;
      --text: #f0f0f2;
      --text-2: #b6b6bd;
      --text-3: #76767f;
      --accent: #8b7cf6;
      --success: #55c980;
      --danger: #e06c75;
      --font-sans: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SFMono-Regular", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --radius-sm: 6px;
      --radius-md: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { min-height: 100vh; margin: 0; background: var(--bg); }
    button, summary { font: inherit; }
    button { color: inherit; }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 11, 13, .94);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(1040px, calc(100% - 32px));
      height: 62px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .identity, .brand-line, .header-actions, .scope, .connection { display: flex; align-items: center; }
    .identity { min-width: 0; gap: 11px; }

    .mark {
      position: relative;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--surface-2);
    }
    .mark::before {
      position: absolute;
      inset: 7px;
      content: "";
      border: 1px solid var(--accent);
      border-radius: 4px;
    }
    .mark::after {
      position: absolute;
      top: 11px;
      left: 11px;
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 2px;
      background: var(--accent);
    }

    .identity-copy { min-width: 0; }
    .brand-line { gap: 10px; }
    .brand-line h1 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: -.01em; }

    .scope {
      min-width: 0;
      gap: 5px;
      color: var(--text-3);
      font-size: 10px;
      white-space: nowrap;
    }
    .scope::before { content: "/"; color: #45454d; }
    .scope strong {
      max-width: 290px;
      overflow: hidden;
      color: var(--text-2);
      font-weight: 520;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread-name {
      max-width: min(52vw, 560px);
      margin-top: 3px;
      overflow: hidden;
      color: var(--text-3);
      font: 10px/1.25 var(--font-mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions { flex: 0 0 auto; gap: 8px; }
    .connection {
      gap: 7px;
      height: 30px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-1);
      color: var(--success);
      font-size: 10px;
      font-weight: 600;
    }
    .connection-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .connection[data-state="connecting"] { color: var(--text-2); }
    .connection[data-state="offline"] { color: var(--danger); }

    .copy-button {
      height: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      background: var(--surface-2);
      color: var(--text-2);
      cursor: pointer;
      font-size: 10px;
      font-weight: 550;
    }
    .copy-button::before { margin-right: 6px; color: var(--text-3); content: "⧉"; }
    .copy-button:hover { border-color: var(--border-strong); background: var(--surface-3); color: var(--text); }
    .copy-button:focus-visible, summary:focus-visible, .jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; }

    .history-loader {
      position: sticky;
      z-index: 10;
      top: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 0;
      translate: 0 13px;
      color: var(--text-3);
      font: 9px/1.2 var(--font-mono);
    }
    .history-loader[hidden] { display: none; }
    .history-spinner {
      width: 12px;
      height: 12px;
      border: 1px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .feed { position: relative; display: grid; gap: 16px; padding: 28px 0 96px 38px; }
    .feed::before {
      position: absolute;
      top: 28px;
      bottom: 96px;
      left: 11px;
      width: 1px;
      content: "";
      background: var(--border);
    }

    .message, .activity-group, .diff-card, .thinking, .empty { position: relative; }
    .message::before, .activity-group::before, .diff-card::before, .thinking::before {
      position: absolute;
      z-index: 2;
      top: 17px;
      left: -32px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--bg);
      border-radius: 2px;
      content: "";
      background: var(--text-3);
      box-shadow: 0 0 0 1px var(--border-strong);
    }

    .message { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-1); }
    .message.user { border-color: #303540; background: #12151a; }
    .message.user::before { background: #8290a8; }
    .message.assistant::before { background: var(--accent); }

    .message-header {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
    }
    .message-author { display: flex; align-items: center; gap: 8px; }
    .author-mark {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      color: var(--text-2);
      font: 8px/1 var(--font-mono);
    }
    .assistant .author-mark { border-color: #514a87; color: #b6adff; }
    .message-role { color: var(--text-2); font-size: 10px; font-weight: 630; }
    .message-time { color: var(--text-3); font: 9px/1 var(--font-mono); }
    .message-text {
      padding: 16px 17px 18px;
      color: #d8d8dd;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.62;
      letter-spacing: -.005em;
    }

    .activity-group { border: 1px solid transparent; border-radius: var(--radius-md); color: var(--text-3); }
    .activity-group::before { top: 13px; width: 6px; height: 6px; background: #6e687f; }
    .activity-group[open] { border-color: var(--border); background: var(--surface-1); }
    .activity-summary {
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      list-style: none;
      font-size: 10px;
    }
    .activity-summary::-webkit-details-marker, .diff-file-summary::-webkit-details-marker { display: none; }
    .activity-summary:hover { background: var(--surface-2); color: var(--text-2); }
    .activity-glyph { width: 16px; height: 16px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 4px; font: 9px/1 var(--font-mono); }
    .activity-glyph::before { content: ">_"; transform: scale(.72); }
    .chevron { width: 5px; height: 5px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
    .activity-group[open] .chevron { transform: rotate(45deg) translateY(-1px); }
    .activity-title { color: var(--text-2); font-weight: 590; }
    .activity-latest { min-width: 0; overflow: hidden; font-family: var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
    .activity-count { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .activity-list { display: grid; padding: 2px 10px 10px 42px; }
    .activity-row { min-height: 25px; display: flex; align-items: center; gap: 8px; color: var(--text-2); font: 10px/1.4 var(--font-mono); }
    .activity-row::before { width: 4px; height: 4px; flex: 0 0 auto; border-radius: 1px; content: ""; background: var(--accent); }
    .activity-row[data-status="completed"]::before { background: var(--success); }
    .activity-status { margin-left: auto; color: var(--text-3); }

    .diff-card { overflow: hidden; border: 1px solid #2a3430; border-radius: var(--radius-md); background: var(--surface-1); }
    .diff-card::before { background: var(--success); }
    .diff-header {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      color: #9cc4aa;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .diff-heading { display: flex; align-items: center; gap: 8px; }
    .diff-heading::before { color: var(--success); content: "±"; font: 13px/1 var(--font-mono); }
    .diff-truncated { color: #c8a96d; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .diff-files { display: grid; }
    .diff-file + .diff-file { border-top: 1px solid var(--border); }
    .diff-file-summary {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      cursor: pointer;
      list-style: none;
      color: var(--text-2);
      font: 10px/1.4 var(--font-mono);
    }
    .diff-file-summary:hover { background: var(--surface-2); }
    .diff-kind { flex: 0 0 auto; border: 1px solid #31523d; border-radius: 4px; padding: 1px 5px; color: #79c58e; font: 8px/1.4 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; }
    .diff-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diff-move { color: var(--text-3); }
    .diff-patch {
      max-height: 420px;
      margin: 0;
      overflow: auto;
      border-top: 1px solid var(--border);
      background: #0d0f0e;
      color: #c9cfcb;
      padding: 13px 15px 15px;
      tab-size: 2;
      white-space: pre;
      font: 11px/1.55 var(--font-mono);
    }

    .thinking::before { top: 14px; width: 6px; height: 6px; background: var(--accent); }
    .thinking-card {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-1);
      color: var(--text-3);
      font-size: 10px;
    }
    .thinking-mark { display: flex; align-items: center; gap: 3px; }
    .thinking-mark span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: thinking-pulse 1.2s ease-in-out infinite;
    }
    .thinking-mark span:nth-child(2) { animation-delay: .15s; }
    .thinking-mark span:nth-child(3) { animation-delay: .3s; }
    .thinking-title { color: var(--text-2); font-weight: 590; }
    .thinking-detail { margin-left: auto; font-family: var(--font-mono); }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes thinking-pulse {
      0%, 60%, 100% { opacity: .32; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-2px); }
    }

    .empty { width: min(360px, 100%); margin: 15vh auto 0; color: var(--text-3); text-align: center; }
    .empty-mark { width: 28px; height: 28px; margin: 0 auto 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-1); }
    .empty-title { margin: 0 0 5px; color: var(--text-2); font-size: 13px; font-weight: 590; }
    .empty-copy { margin: 0; font-size: 11px; line-height: 1.5; }

    .jump {
      position: fixed;
      z-index: 22;
      right: max(20px, calc((100vw - 960px) / 2));
      bottom: 20px;
      translate: 0 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      background: var(--surface-3);
      color: var(--text-2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
      cursor: pointer;
      font-size: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s, translate .15s;
    }
    .jump.visible { translate: 0; opacity: 1; pointer-events: auto; }

    @media (max-width: 680px) {
      .topbar-inner, .shell { width: min(100% - 22px, 1040px); }
      .topbar-inner { height: 58px; gap: 10px; }
      .scope, .copy-button { display: none; }
      .thread-name { max-width: 52vw; }
      .connection { height: 28px; padding: 0 8px; }
      .feed { gap: 13px; padding: 20px 0 80px 27px; }
      .feed::before { top: 20px; bottom: 80px; left: 6px; }
      .message::before, .activity-group::before, .diff-card::before, .thinking::before { left: -25px; }
      .message-text { padding: 14px 14px 16px; font-size: 13px; }
      .activity-latest { display: none; }
      .diff-file-summary, .diff-header { padding-right: 11px; padding-left: 11px; }
      .jump { right: 12px; bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      .history-spinner, .thinking-mark span { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="identity">
        <div class="mark" aria-hidden="true"></div>
        <div class="identity-copy">
          <div class="brand-line">
            <h1>Codex Share</h1>
            <div class="scope"><span>scope</span><strong>__PERMISSION__</strong></div>
          </div>
          <div class="thread-name" title="__SOURCE__">__SOURCE__</div>
        </div>
      </div>
      <div class="header-actions">
        <div id="connection" class="connection" data-state="connecting" role="status"><span class="connection-dot"></span><span id="connection-label">Connecting</span></div>
        <button id="copy" class="copy-button" type="button">Copy link</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <div id="history-loader" class="history-loader" hidden>
      <span class="history-spinner" aria-hidden="true"></span>
      Loading earlier messages
    </div>
    <main id="feed" class="feed" aria-live="off">
      <div id="empty" class="empty"><div class="empty-mark"></div>Waiting for thread activity…</div>
    </main>
  </div>

  <button id="jump" class="jump" type="button">Jump to latest ↓</button>

  <script>
    const token = '__TOKEN__';
    const PAGE_SIZE = 40;
    const feed = document.querySelector('#feed');
    const connection = document.querySelector('#connection');
    const connectionLabel = document.querySelector('#connection-label');
    const historyLoader = document.querySelector('#history-loader');
    const jump = document.querySelector('#jump');
    const copy = document.querySelector('#copy');
    const eventsById = new Map();
    const liveBuffer = [];
    let orderedEvents = [];
    let snapshotReady = false;
    let initialPositioned = false;
    let hasMore = true;
    let loadingOlder = false;
    let pinned = true;
    let isWorking = false;

    function setConnection(state, label) {
      connection.dataset.state = state;
      connectionLabel.textContent = label;
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      return Number.isNaN(date.valueOf()) ? '' : date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function scrollToLatest(behavior = 'smooth') {
      window.scrollTo({ top: document.documentElement.scrollHeight, behavior });
    }

    function mergeEvents(events) {
      events.forEach(event => eventsById.set(event.id, event));
      orderedEvents = [...eventsById.values()].sort((a, b) => a.id - b.id);
    }

    function createEmpty() {
      const empty = document.createElement('div');
      empty.className = 'empty';
      const mark = document.createElement('div');
      mark.className = 'empty-mark';
      const title = document.createElement('p');
      title.className = 'empty-title';
      title.textContent = 'Waiting for thread activity';
      const copy = document.createElement('p');
      copy.className = 'empty-copy';
      copy.textContent = 'Messages will appear here as the conversation begins.';
      empty.append(mark, title, copy);
      return empty;
    }

    function createMessage(event) {
      const article = document.createElement('article');
      article.className = `message ${event.role}`;
      const header = document.createElement('div');
      header.className = 'message-header';
      const author = document.createElement('div');
      author.className = 'message-author';
      const mark = document.createElement('span');
      mark.className = 'author-mark';
      mark.textContent = event.role === 'assistant' ? 'C' : 'Y';
      const role = document.createElement('span');
      role.className = 'message-role';
      role.textContent = event.role === 'assistant' ? 'Codex' : 'You';
      author.append(mark, role);
      const time = document.createElement('time');
      time.className = 'message-time';
      time.textContent = formatTime(event.timestamp);
      header.append(author, time);
      const text = document.createElement('div');
      text.className = 'message-text';
      text.textContent = event.text;
      article.append(header, text);
      return article;
    }

    function currentActivityGroup() {
      const last = feed.lastElementChild;
      return last?.classList.contains('activity-group') ? last : null;
    }

    function createActivityGroup() {
      const details = document.createElement('details');
      details.className = 'activity-group';
      details.dataset.count = '0';
      const summary = document.createElement('summary');
      summary.className = 'activity-summary';
      const glyph = document.createElement('span');
      glyph.className = 'activity-glyph';
      const chevron = document.createElement('span');
      chevron.className = 'chevron';
      const title = document.createElement('span');
      title.className = 'activity-title';
      title.textContent = 'Agent activity';
      const latest = document.createElement('span');
      latest.className = 'activity-latest';
      const count = document.createElement('span');
      count.className = 'activity-count';
      summary.append(glyph, chevron, title, latest, count);
      const list = document.createElement('div');
      list.className = 'activity-list';
      details.append(summary, list);
      return details;
    }

    function addActivity(event) {
      let group = currentActivityGroup();
      if (!group) {
        group = createActivityGroup();
        feed.append(group);
      }
      const row = document.createElement('div');
      row.className = 'activity-row';
      row.dataset.status = event.status;
      const name = document.createElement('span');
      name.textContent = event.name;
      const status = document.createElement('span');
      status.className = 'activity-status';
      status.textContent = event.status;
      row.append(name, status);
      group.querySelector('.activity-list').append(row);
      const count = Number(group.dataset.count) + 1;
      group.dataset.count = String(count);
      group.querySelector('.activity-count').textContent = `${count} ${count === 1 ? 'event' : 'events'}`;
      group.querySelector('.activity-latest').textContent = `${event.name} ${event.status}`;
    }

    function createDiff(event) {
      const card = document.createElement('section');
      card.className = 'diff-card';
      const header = document.createElement('div');
      header.className = 'diff-header';
      const title = document.createElement('span');
      title.className = 'diff-heading';
      title.textContent = `${event.files.length} ${event.files.length === 1 ? 'file changed' : 'files changed'}`;
      header.append(title);
      if (event.truncated) {
        const warning = document.createElement('span');
        warning.className = 'diff-truncated';
        warning.textContent = 'Preview truncated';
        header.append(warning);
      }
      const files = document.createElement('div');
      files.className = 'diff-files';
      event.files.forEach((file, index) => {
        const details = document.createElement('details');
        details.className = 'diff-file';
        details.open = event.files.length === 1 || index === 0;
        const summary = document.createElement('summary');
        summary.className = 'diff-file-summary';
        const kind = document.createElement('span');
        kind.className = 'diff-kind';
        kind.textContent = file.kind;
        const path = document.createElement('span');
        path.className = 'diff-path';
        path.textContent = file.path;
        summary.append(kind, path);
        if (file.movePath) {
          const move = document.createElement('span');
          move.className = 'diff-move';
          move.textContent = `→ ${file.movePath}`;
          summary.append(move);
        }
        const patch = document.createElement('pre');
        patch.className = 'diff-patch';
        patch.textContent = file.patch || '(no textual changes)';
        details.append(summary, patch);
        files.append(details);
      });
      card.append(header, files);
      return card;
    }

    function createThinking() {
      const row = document.createElement('div');
      row.className = 'thinking';
      row.setAttribute('role', 'status');
      const card = document.createElement('div');
      card.className = 'thinking-card';
      const dots = document.createElement('span');
      dots.className = 'thinking-mark';
      dots.setAttribute('aria-hidden', 'true');
      dots.append(document.createElement('span'), document.createElement('span'), document.createElement('span'));
      const title = document.createElement('span');
      title.className = 'thinking-title';
      title.textContent = 'Codex is working';
      const detail = document.createElement('span');
      detail.className = 'thinking-detail';
      detail.textContent = 'Live';
      card.append(dots, title, detail);
      row.append(card);
      return row;
    }

    function renderAll() {
      feed.replaceChildren();
      let visibleEvents = 0;
      orderedEvents.forEach(event => {
        if (event.kind === 'status') return;
        if (event.kind === 'message') {
          feed.append(createMessage(event));
          visibleEvents += 1;
        } else if (event.kind === 'activity') {
          addActivity(event);
          visibleEvents += 1;
        } else if (event.kind === 'diff') {
          feed.append(createDiff(event));
          visibleEvents += 1;
        }
      });
      if (!visibleEvents) feed.append(createEmpty());
      if (isWorking) feed.append(createThinking());
    }

    async function fetchPage(before) {
      const query = new URLSearchParams({ limit: String(PAGE_SIZE) });
      if (before !== undefined) query.set('before', String(before));
      const response = await fetch(`/s/${token}/snapshot?${query}`);
      if (!response.ok) throw new Error('snapshot unavailable');
      return response.json();
    }

    async function loadOlder() {
      if (!snapshotReady || !initialPositioned || loadingOlder || !hasMore || !orderedEvents.length) return;
      loadingOlder = true;
      historyLoader.hidden = false;
      const previousHeight = document.documentElement.scrollHeight;
      const previousY = window.scrollY;
      try {
        const page = await fetchPage(orderedEvents[0].id);
        hasMore = page.hasMore;
        mergeEvents(page.events);
        renderAll();
        requestAnimationFrame(() => {
          const addedHeight = document.documentElement.scrollHeight - previousHeight;
          window.scrollTo({ top: previousY + addedHeight, behavior: 'auto' });
          historyLoader.hidden = true;
          loadingOlder = false;
        });
      } catch {
        historyLoader.hidden = true;
        loadingOlder = false;
      }
    }

    function addLive(event) {
      mergeEvents([event]);
      if (event.kind === 'status') isWorking = event.status === 'working';
      renderAll();
      if (pinned) requestAnimationFrame(() => scrollToLatest('auto'));
    }

    window.addEventListener('scroll', () => {
      const distance = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
      pinned = distance < 120;
      jump.classList.toggle('visible', !pinned);
      if (window.scrollY < 220) loadOlder();
    }, { passive: true });

    jump.addEventListener('click', () => {
      pinned = true;
      jump.classList.remove('visible');
      scrollToLatest();
    });

    copy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy link'; }, 1400);
      } catch {
        copy.textContent = 'Copy failed';
      }
    });

    function connectLiveStream() {
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const stream = new WebSocket(`${scheme}://${location.host}/s/${token}/events/ws`);
      stream.onopen = () => setConnection('live', 'Live');
      stream.onclose = () => {
        setConnection('offline', 'Reconnecting');
        window.setTimeout(connectLiveStream, 1000);
      };
      stream.onerror = () => stream.close();
      stream.onmessage = event => {
        const value = JSON.parse(event.data);
        if (!snapshotReady) liveBuffer.push(value);
        else addLive(value);
      };
    }

    connectLiveStream();

    fetchPage()
      .then(page => {
        hasMore = page.hasMore;
        isWorking = page.isWorking;
        mergeEvents(page.events);
        snapshotReady = true;
        liveBuffer.sort((a, b) => a.id - b.id).forEach(event => {
          eventsById.set(event.id, event);
          if (event.kind === 'status') isWorking = event.status === 'working';
        });
        liveBuffer.length = 0;
        orderedEvents = [...eventsById.values()].sort((a, b) => a.id - b.id);
        renderAll();
        feed.setAttribute('aria-live', 'polite');
        requestAnimationFrame(() => {
          scrollToLatest('auto');
          initialPositioned = true;
        });
      })
      .catch(() => {
        snapshotReady = true;
        setConnection('offline', 'Unavailable');
      });
  </script>
</body>
</html>
